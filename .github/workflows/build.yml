name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на сайте GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Исходный код репозитория
      uses: actions/checkout@v4

    - name: Настройка JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Выдача прав на gradle wrapper
      run: chmod +x gradlew

    - name: Сборка мода через Gradle
      run: ./gradlew build

    - name: Сохранение готового .jar файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Gemini-Mod-1.21.11
        path: build/libs/*.jar
